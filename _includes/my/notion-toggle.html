{% assign level = include.level | default: 5 %}

{% assign level_num = level | plus: 0 %}

{% if level_num < 1 or level_num > 5 %}
  {% assign level = 5 %}
{% endif %}

<details class="notion-toggle notion-toggle-h{{ level }}">
  <summary>
    <span class="notion-toggle-title">
      {{ include.title }}
    </span>
  </summary>

  <div class="notion-toggle-body">
    {{ include.content | markdownify }}
  </div>
</details>
